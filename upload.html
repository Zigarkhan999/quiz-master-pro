<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Quiz MCQs</title>
<link rel="stylesheet" href="style.css">
<style>
  textarea {
    width: 100%;
    height: 200px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: monospace;
    box-sizing: border-box;
  }
  .share-card {
    display: none;
    background: #f0fdf4;
    border: 1px solid #16a34a;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
    text-align: center;
  }
  .loading-spinner {
    display: none;
    color: #2563eb;
    font-weight: bold;
    margin-top: 10px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📤 Create & Publish Test</h1>

  <label style="font-weight:bold; display:block; margin-bottom:5px;">1. Select Subject:</label>
  <select id="subjectSelect" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; font-size:16px;">
    <option value="chemistry">🧪 Chemistry</option>
    <option value="biology">🧬 Biology</option>
    <option value="physics">⚡ Physics</option>
  </select>

  <label style="font-weight:bold; display:block; margin-bottom:5px;">2. Set Test Name/Code (e.g. CHEM1, MDCAT1):</label>
  <input type="text" id="testCodeInput" placeholder="Enter Test Code" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; font-size:16px; box-sizing:border-box;">

  <label style="font-weight:bold; display:block; margin-bottom:5px;">3. Paste JSON MCQs:</label>
  <textarea id="jsonInput" placeholder='Paste JSON array here...'></textarea>

  <button id="pubBtn" onclick="publishTest()" style="margin-top: 15px; background: #16a34a; width:100%;">🚀 Publish Test & Generate Link</button>
  <div id="loader" class="loading-spinner">⏳ Saving test to GitHub... Please wait...</div>

  <div id="shareCard" class="share-card">
    <h3 style="color: #15803d; margin-top:0;">✅ Official Test Link Ready!</h3>
    <p>Yeh short link WhatsApp par share karein:</p>
    <input type="text" id="shareUrlInput" readonly style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; margin-bottom:10px; font-weight:bold;">
    <button onclick="copyShareLink()" style="background: #16a34a; width:100%;">📋 Copy Link</button>
  </div>

  <button onclick="location.href='index.html'" style="background: #6c757d; margin-top: 10px; width:100%;">🏠 Back to Home</button>
</div>

<script>
// GH Configuration
const GH_USERNAME = 'zigarkhan999';
const GH_REPO = 'quiz-master-pro';
const GH_TOKEN = 'YOUR_GITHUB_TOKEN_HERE'; // Step 1 wala token yahan paste karein

function normalizeJSONAnswers(questions) {
  return questions.map(q => {
    let optsArray = [];
    if (Array.isArray(q.options)) {
      optsArray = q.options;
    } else if (typeof q.options === 'object' && q.options !== null) {
      optsArray = [
        q.options.A || q.options.a || "",
        q.options.B || q.options.b || "",
        q.options.C || q.options.c || "",
        q.options.D || q.options.d || ""
      ];
    }

    let ans = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : q.correct_answer);
    let ansIdx = 0;

    if (typeof ans === 'string') {
      let cleanAns = ans.trim().toUpperCase();
      if (cleanAns === 'A' || cleanAns === '0') ansIdx = 0;
      else if (cleanAns === 'B' || cleanAns === '1') ansIdx = 1;
      else if (cleanAns === 'C' || cleanAns === '2') ansIdx = 2;
      else if (cleanAns === 'D' || cleanAns === '3') ansIdx = 3;
      else {
        let matchIdx = optsArray.findIndex(opt => String(opt).trim().toLowerCase() === ans.trim().toLowerCase());
        if (matchIdx !== -1) ansIdx = matchIdx;
      }
    } else if (typeof ans === 'number') {
      ansIdx = ans;
    }

    return { question: q.question || "", options: optsArray, answer: ansIdx };
  });
}

async function publishTest() {
  const inputText = document.getElementById('jsonInput').value.trim();
  const selectedSubject = document.getElementById('subjectSelect').value;
  let testCode = document.getElementById('testCodeInput').value.trim().toLowerCase().replace(/[^a-z0-9]/g, '');

  if (!testCode) {
    alert("Test Code likhein (jaise chem1)!");
    return;
  }
  if (!inputText) {
    alert("Pehle JSON MCQs paste karein!");
    return;
  }

  let formattedQuestions;
  try {
    let rawQuestions = JSON.parse(inputText);
    if (!Array.isArray(rawQuestions)) {
      alert("Format galat hai! JSON array [...] hona chahiye.");
      return;
    }
    formattedQuestions = normalizeJSONAnswers(rawQuestions);
  } catch (e) {
    alert("JSON Syntax Error!");
    return;
  }

  const payload = {
    subject: selectedSubject,
    questions: formattedQuestions
  };

  document.getElementById('pubBtn').disabled = true;
  document.getElementById('loader').style.display = 'block';

  const fileName = `tests/${testCode}.json`;
  const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload))));

  try {
    // Check if file exists to get SHA
    let sha = '';
    const checkRes = await fetch(`https://api.github.com/repos/${GH_USERNAME}/${GH_REPO}/contents/${fileName}`, {
      headers: { 'Authorization': `token ${GH_TOKEN}` }
    });
    if (checkRes.ok) {
      const checkData = await checkRes.json();
      sha = checkData.sha;
    }

    // Create or Update File in Github
    const putRes = await fetch(`https://api.github.com/repos/${GH_USERNAME}/${GH_REPO}/contents/${fileName}`, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${GH_TOKEN}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: `Add test ${testCode}`,
        content: contentEncoded,
        sha: sha ? sha : undefined
      })
    });

    document.getElementById('pubBtn').disabled = false;
    document.getElementById('loader').style.display = 'none';

    if (putRes.ok) {
      const baseUrl = window.location.href.replace('upload.html', 'quiz.html');
      const finalUrl = `${baseUrl}?file=${testCode}`;

      document.getElementById('shareUrlInput').value = finalUrl;
      document.getElementById('shareCard').style.display = 'block';
    } else {
      alert("GitHub Token Error! Token check karein.");
    }

  } catch (err) {
    document.getElementById('pubBtn').disabled = false;
    document.getElementById('loader').style.display = 'none';
    alert("Network Error!");
  }
}

function copyShareLink() {
  const input = document.getElementById('shareUrlInput');
  input.select();
  navigator.clipboard.writeText(input.value);
  alert("Link Copy Ho Gaya!");
}
</script>

</body>
      </html>
