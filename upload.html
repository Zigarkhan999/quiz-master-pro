<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Quiz MCQs</title>
<link rel="stylesheet" href="style.css">
<style>
  textarea {
    width: 100%;
    height: 180px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: monospace;
    box-sizing: border-box;
  }
  .share-card {
    display: none;
    background: #f0fdf4;
    border: 1px solid #16a34a;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📤 Create & Publish Test</h1>

  <label style="font-weight:bold; display:block; margin-bottom:5px;">1. Select Subject:</label>
  <select id="subjectSelect" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; font-size:16px;">
    <option value="chemistry">🧪 Chemistry</option>
    <option value="biology">🧬 Biology</option>
    <option value="physics">⚡ Physics</option>
  </select>

  <label style="font-weight:bold; display:block; margin-bottom:5px;">2. Set Test Code (e.g. CHEM1, MDCAT2026):</label>
  <input type="text" id="testCodeInput" placeholder="Enter Test Code (e.g. CHEM101)" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; font-size:16px; box-sizing:border-box;">

  <label style="font-weight:bold; display:block; margin-bottom:5px;">3. Paste JSON MCQs:</label>
  <textarea id="jsonInput" placeholder='Paste JSON array here...'></textarea>

  <button onclick="publishTest()" style="margin-top: 15px; background: #16a34a; width:100%;">🚀 Publish Test & Get Clean Link</button>

  <div id="shareCard" class="share-card">
    <h3 style="color: #15803d; margin-top:0;">✅ Official Test Link Ready!</h3>
    <p>Students ke sath yeh short clean link share karein:</p>
    <input type="text" id="shareUrlInput" readonly style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; margin-bottom:10px; font-weight:bold;">
    <button onclick="copyShareLink()" style="background: #16a34a; width:100%;">📋 Copy Clean Link</button>
  </div>

  <button onclick="location.href='index.html'" style="background: #6c757d; margin-top: 10px; width:100%;">🏠 Back to Home</button>
</div>

<script>
function normalizeJSONAnswers(questions) {
  return questions.map(q => {
    let optsArray = [];
    if (Array.isArray(q.options)) {
      optsArray = q.options;
    } else if (typeof q.options === 'object' && q.options !== null) {
      optsArray = [
        q.options.A || q.options.a || "",
        q.options.B || q.options.b || "",
        q.options.C || q.options.c || "",
        q.options.D || q.options.d || ""
      ];
    }

    let ans = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : q.correct_answer);
    let ansIdx = 0;

    if (typeof ans === 'string') {
      let cleanAns = ans.trim().toUpperCase();
      if (cleanAns === 'A' || cleanAns === '0') ansIdx = 0;
      else if (cleanAns === 'B' || cleanAns === '1') ansIdx = 1;
      else if (cleanAns === 'C' || cleanAns === '2') ansIdx = 2;
      else if (cleanAns === 'D' || cleanAns === '3') ansIdx = 3;
      else {
        let matchIdx = optsArray.findIndex(opt => String(opt).trim().toLowerCase() === ans.trim().toLowerCase());
        if (matchIdx !== -1) ansIdx = matchIdx;
      }
    } else if (typeof ans === 'number') {
      ansIdx = ans;
    }

    return { question: q.question || "", options: optsArray, answer: ansIdx };
  });
}

function publishTest() {
  const inputText = document.getElementById('jsonInput').value.trim();
  const selectedSubject = document.getElementById('subjectSelect').value;
  let testCode = document.getElementById('testCodeInput').value.trim().toUpperCase();

  if (!testCode) {
    alert("Kritpya Test Code likhein (jaise CHEM1, TEST01)!");
    return;
  }
  if (!inputText) {
    alert("Pehle JSON MCQs paste karein!");
    return;
  }

  try {
    let rawQuestions = JSON.parse(inputText);
    if (!Array.isArray(rawQuestions)) {
      alert("Format galat hai! JSON array [...] hona chahiye.");
      return;
    }

    const formattedQuestions = normalizeJSONAnswers(rawQuestions);

    // Save under Test Code
    const testPackage = {
      subject: selectedSubject,
      code: testCode,
      questions: formattedQuestions
    };

    localStorage.setItem('TEST_' + testCode, JSON.stringify(testPackage));
    localStorage.setItem('quiz_' + selectedSubject, JSON.stringify(formattedQuestions));
    localStorage.setItem('selectedSubject', selectedSubject);

    // Generate Clean Link
    const baseUrl = window.location.href.replace('upload.html', 'quiz.html');
    const cleanUrl = `${baseUrl}?code=${testCode}`;

    document.getElementById('shareUrlInput').value = cleanUrl;
    document.getElementById('shareCard').style.display = 'block';

  } catch (e) {
    alert("JSON Syntax Error! Double quotes (\") check karein.");
  }
}

function copyShareLink() {
  const input = document.getElementById('shareUrlInput');
  input.select();
  navigator.clipboard.writeText(input.value);
  alert("Clean Test Link Copy Ho Gaya!");
}
</script>

</body>
  </html>
