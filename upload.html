<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload & Share Quiz MCQs</title>
<link rel="stylesheet" href="style.css">
<style>
  textarea {
    width: 100%;
    height: 200px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: monospace;
    box-sizing: border-box;
  }
  .share-card {
    display: none;
    background: #e0f2fe;
    border: 1px solid #0284c7;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
    text-align: center;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📤 Upload & Share MCQs</h1>
  <p>Select Subject & Paste your JSON array below:</p>

  <label style="font-weight:bold; display:block; margin-bottom:5px;">Select Subject:</label>
  <select id="subjectSelect" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; font-size:16px;">
    <option value="chemistry">🧪 Chemistry</option>
    <option value="biology">🧬 Biology</option>
    <option value="physics">⚡ Physics</option>
  </select>

  <textarea id="jsonInput" placeholder='Paste your JSON MCQs array here...'></textarea>

  <button onclick="saveAndStartQuiz()" style="margin-top: 15px; background: #16a34a; width:100%;">🚀 Save & Start My Test</button>
  <button onclick="generateShareableLink()" style="margin-top: 10px; background: #2563eb; width:100%;">🔗 Generate Share Link For Students</button>
  
  <div id="shareCard" class="share-card">
    <h3 style="color: #0369a1; margin-top:0;">📋 Student Share Link Ready!</h3>
    <p>Is link ko copy karke students ke sath WhatsApp par share karein:</p>
    <input type="text" id="shareUrlInput" readonly style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; margin-bottom:10px;">
    <button onclick="copyShareLink()" style="background: #0284c7; width:100%;">📋 Copy Test Link</button>
  </div>

  <button onclick="location.href='index.html'" style="background: #6c757d; margin-top: 10px; width:100%;">🏠 Back to Home</button>
</div>

<script>
function normalizeJSONAnswers(questions) {
  return questions.map(q => {
    let optsArray = [];

    if (Array.isArray(q.options)) {
      optsArray = q.options;
    } else if (typeof q.options === 'object' && q.options !== null) {
      optsArray = [
        q.options.A || q.options.a || "",
        q.options.B || q.options.b || "",
        q.options.C || q.options.c || "",
        q.options.D || q.options.d || ""
      ];
    }

    let ans = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : q.correct_answer);
    let ansIdx = 0;

    if (typeof ans === 'string') {
      let cleanAns = ans.trim().toUpperCase();
      if (cleanAns === 'A' || cleanAns === '0') ansIdx = 0;
      else if (cleanAns === 'B' || cleanAns === '1') ansIdx = 1;
      else if (cleanAns === 'C' || cleanAns === '2') ansIdx = 2;
      else if (cleanAns === 'D' || cleanAns === '3') ansIdx = 3;
      else {
        let matchIdx = optsArray.findIndex(opt => String(opt).trim().toLowerCase() === ans.trim().toLowerCase());
        if (matchIdx !== -1) ansIdx = matchIdx;
      }
    } else if (typeof ans === 'number') {
      ansIdx = ans;
    }

    return {
      question: q.question || q.qText || "",
      options: optsArray,
      answer: ansIdx
    };
  });
}

function getFormattedData() {
  const inputText = document.getElementById('jsonInput').value.trim();
  if (!inputText) return null;

  try {
    let rawQuestions = JSON.parse(inputText);
    if (!Array.isArray(rawQuestions)) return null;
    return normalizeJSONAnswers(rawQuestions);
  } catch (e) {
    return null;
  }
}

function saveAndStartQuiz() {
  const selectedSubject = document.getElementById('subjectSelect').value;
  const formattedQuestions = getFormattedData();

  if (!formattedQuestions) {
    alert("Pehle sahi JSON MCQs paste karein!");
    return;
  }

  localStorage.setItem('quiz_' + selectedSubject, JSON.stringify(formattedQuestions));
  localStorage.setItem('selectedSubject', selectedSubject);

  alert(`${selectedSubject.toUpperCase()} ke ${formattedQuestions.length} MCQs save ho gaye hain! Test shuru ho raha hai...`);
  window.location.href = 'quiz.html';
}

function generateShareableLink() {
  const selectedSubject = document.getElementById('subjectSelect').value;
  const formattedQuestions = getFormattedData();

  if (!formattedQuestions) {
    alert("Pehle valid JSON MCQs paste karein!");
    return;
  }

  const jsonString = JSON.stringify(formattedQuestions);
  const encodedData = encodeURIComponent(jsonString);

  // Generates link for student URL
  const baseUrl = window.location.href.replace('upload.html', 'quiz.html');
  const fullShareUrl = `${baseUrl}?subject=${selectedSubject}&data=${encodedData}`;

  document.getElementById('shareUrlInput').value = fullShareUrl;
  document.getElementById('shareCard').style.display = 'block';
}

function copyShareLink() {
  const input = document.getElementById('shareUrlInput');
  input.select();
  input.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(input.value);
  alert(" Test Link Copy Ho Gaya Hai! Ab Isse WhatsApp Par Share Karein.");
}
</script>

</body>
</html>
