<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Quiz MCQs</title>
<link rel="stylesheet" href="style.css">
<style>
  textarea {
    width: 100%;
    height: 250px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: monospace;
    box-sizing: border-box;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📤 Upload MCQs</h1>
  <p>Select subject and paste your JSON array:</p>

  <label style="font-weight:bold; display:block; margin-bottom:5px;">Target Subject:</label>
  <select id="subjectSelect" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; font-size:16px;">
    <option value="biology">🧬 Biology</option>
    <option value="chemistry">🧪 Chemistry</option>
    <option value="physics">⚡ Physics</option>
  </select>

  <textarea id="jsonInput" placeholder='Paste your JSON MCQs array here...'></textarea>

  <button onclick="saveAndStartQuiz()" style="margin-top: 15px; background: #16a34a; width:100%;">🚀 Save & Start Selected Test</button>
  <button onclick="location.href='index.html'" style="background: #6c757d; margin-top: 10px; width:100%;">🏠 Back to Home</button>
</div>

<script>
function saveAndStartQuiz() {
  const inputText = document.getElementById('jsonInput').value.trim();
  const selectedSubject = document.getElementById('subjectSelect').value;

  if (!inputText) {
    alert("Pehle JSON MCQs paste karein!");
    return;
  }

  try {
    const newQuestions = JSON.parse(inputText);
    if (!Array.isArray(newQuestions)) {
      alert("Format galat hai! Code ek Array [...] se shuru aur khatam hona chahiye.");
      return;
    }

    // Har subject ka alag storage key
    localStorage.setItem('quiz_' + selectedSubject, JSON.stringify(newQuestions));
    localStorage.setItem('selectedSubject', selectedSubject);

    alert(`${selectedSubject.toUpperCase()} ke ${newQuestions.length} MCQs successfully save ho gaye hain!`);
    window.location.href = 'quiz.html';

  } catch (e) {
    alert("JSON Format mein error hai! Syntax check karein.");
  }
}
</script>

</body>
</html>
