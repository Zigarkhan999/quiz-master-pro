<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Quiz MCQs</title>
<link rel="stylesheet" href="style.css">
<style>
  textarea {
    width: 100%;
    height: 200px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: monospace;
    box-sizing: border-border-box;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📤 Upload MCQs</h1>
  <p>Paste your JSON MCQs array below to add them to the quiz database:</p>

  <textarea id="jsonInput" placeholder='[
  {
    "subject": "biology",
    "question": "Sample Question?",
    "options": ["Opt 1", "Opt 2", "Opt 3", "Opt 4"],
    "answer": 0
  }
]'></textarea>

  <button onclick="saveAndStartQuiz()" style="margin-top: 15px;">🚀 Save & Start Test</button>
  <button onclick="location.href='index.html'" style="background: #6c757d; margin-top: 10px;">🏠 Back to Home</button>
</div>

<script>
function saveAndStartQuiz() {
  const inputText = document.getElementById('jsonInput').value.trim();
  if (!inputText) {
    alert("Kharay rehnay ke bajaye pehle JSON MCQs paste karein!");
    return;
  }

  try {
    const newQuestions = JSON.parse(inputText);
    if (!Array.isArray(newQuestions)) {
      alert("Format galat hai! Input ek JSON Array [...] hona chahiye.");
      return;
    }

    // Pehle se mojood questions ke sath naye combine karna
    let existingData = JSON.parse(localStorage.getItem('customQuizData')) || [];
    let updatedData = [...existingData, ...newQuestions];

    // LocalStorage mein save karna (site par permanent practice ke liye)
    localStorage.setItem('customQuizData', JSON.stringify(updatedData));

    // Pehle question ka subject auto-select karna (default: biology)
    const targetSubject = newQuestions[0]?.subject || 'biology';
    localStorage.setItem('selectedSubject', targetSubject);

    alert("MCQs successfully save ho gaye hain!");
    window.location.href = 'quiz.html';

  } catch (e) {
    alert("Invalid JSON Format! Apne JSON code ki syntax check karein.");
  }
}
</script>

</body>
</html>
