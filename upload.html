<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Quiz MCQs</title>
<link rel="stylesheet" href="style.css">
<style>
  textarea {
    width: 100%;
    height: 220px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: monospace;
    font-size: 14px;
    box-sizing: border-box;
    resize: vertical;
  }
  .share-card {
    display: none;
    background: #f0fdf4;
    border: 1px solid #16a34a;
    padding: 15px;
    border-radius: 8px;
    margin-top: 15px;
    text-align: center;
  }
  .loading {
    display: none;
    color: #2563eb;
    font-weight: bold;
    margin: 10px 0;
  }
</style>
</head>
<body>

<div class="container">
  <h1>📤 Create & Publish Test</h1>

  <label style="font-weight:bold; display:block; margin-bottom:5px;">1. Select Subject:</label>
  <select id="subjectSelect" style="width:100%; padding:10px; margin-bottom:15px; border-radius:6px; border:1px solid #ccc; font-size:16px;">
    <option value="chemistry">🧪 Chemistry</option>
    <option value="biology">🧬 Biology</option>
    <option value="physics">⚡ Physics</option>
  </select>

  <label style="font-weight:bold; display:block; margin-bottom:5px;">2. Paste JSON MCQs (Supports 200+ MCQs):</label>
  <textarea id="jsonInput" placeholder='Paste JSON array here...'></textarea>

  <button id="pubBtn" onclick="handlePublish()" style="margin-top: 15px; background: #16a34a; width:100%; padding:12px; color:#fff; border:none; border-radius:6px; font-weight:bold; font-size:16px; cursor:pointer;">🚀 Generate Test Link</button>
  
  <div id="loader" class="loading">⏳ Processing MCQs & Generating Link... Please Wait...</div>

  <div id="shareCard" class="share-card">
    <h3 style="color: #15803d; margin-top:0;">✅ Official Test Link Ready!</h3>
    <p>Copy & share this link:</p>
    <input type="text" id="shareUrlInput" readonly style="width:100%; padding:8px; border-radius:4px; border:1px solid #ccc; margin-bottom:10px; font-weight:bold;">
    <button onclick="copyShareLink()" style="background: #16a34a; width:100%; color:#fff; padding:10px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">📋 Copy Link</button>
  </div>

  <button onclick="location.href='index.html'" style="background: #6c757d; margin-top: 10px; width:100%; color:#fff; padding:10px; border:none; border-radius:6px; cursor:pointer;">🏠 Back to Home</button>
</div>

<script>
// Fast, High-Performance Normalizer for 200+ MCQs
function normalizeJSONAnswersFast(questions) {
  const len = questions.length;
  const result = new Array(len);

  for (let i = 0; i < len; i++) {
    const q = questions[i];
    let optsArray = [];

    if (Array.isArray(q.options)) {
      optsArray = q.options;
    } else if (q.options && typeof q.options === 'object') {
      optsArray = [
        q.options.A || q.options.a || "",
        q.options.B || q.options.b || "",
        q.options.C || q.options.c || "",
        q.options.D || q.options.d || ""
      ];
    }

    let ans = q.answer !== undefined ? q.answer : (q.correct !== undefined ? q.correct : q.correct_answer);
    let ansIdx = 0;

    if (typeof ans === 'number') {
      ansIdx = ans;
    } else if (typeof ans === 'string') {
      const cleanAns = ans.trim().toUpperCase();
      if (cleanAns === 'A' || cleanAns === '0') ansIdx = 0;
      else if (cleanAns === 'B' || cleanAns === '1') ansIdx = 1;
      else if (cleanAns === 'C' || cleanAns === '2') ansIdx = 2;
      else if (cleanAns === 'D' || cleanAns === '3') ansIdx = 3;
      else {
        const lowerAns = ans.trim().toLowerCase();
        for (let j = 0; j < optsArray.length; j++) {
          if (String(optsArray[j]).trim().toLowerCase() === lowerAns) {
            ansIdx = j;
            break;
          }
        }
      }
    }

    result[i] = {
      question: q.question || "",
      options: optsArray,
      answer: ansIdx
    };
  }

  return result;
}

function handlePublish() {
  const btn = document.getElementById('pubBtn');
  const loader = document.getElementById('loader');
  const shareCard = document.getElementById('shareCard');

  btn.disabled = true;
  loader.style.display = 'block';
  shareCard.style.display = 'none';

  // Timeout ensures UI updates before running heavy JSON parsing
  setTimeout(async () => {
    try {
      const inputText = document.getElementById('jsonInput').value.trim();
      const selectedSubject = document.getElementById('subjectSelect').value;

      if (!inputText) {
        alert("Please paste JSON MCQs first!");
        btn.disabled = false;
        loader.style.display = 'none';
        return;
      }

      let rawQuestions;
      try {
        rawQuestions = JSON.parse(inputText);
      } catch (e) {
        alert("Invalid JSON Format! Check syntax errors.");
        btn.disabled = false;
        loader.style.display = 'none';
        return;
      }

      if (!Array.isArray(rawQuestions)) {
        alert("Format error! JSON must be an array [...]");
        btn.disabled = false;
        loader.style.display = 'none';
        return;
      }

      const formattedQuestions = normalizeJSONAnswersFast(rawQuestions);

      const payload = {
        s: selectedSubject,
        q: formattedQuestions
      };

      // API Call to high-speed storage endpoint
      const res = await fetch('https://dpaste.com/api/v2/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          'content': JSON.stringify(payload),
          'expiry_days': '365',
          'syntax': 'json'
        })
      });

      const pasteUrl = await res.text();

      if (res.ok && pasteUrl.includes('dpaste.com')) {
        const pasteId = pasteUrl.trim().split('/').filter(Boolean).pop();
        const baseUrl = window.location.href.split('upload.html')[0] + 'quiz.html';
        const finalUrl = `${baseUrl}?id=${pasteId}`;

        document.getElementById('shareUrlInput').value = finalUrl;
        shareCard.style.display = 'block';
      } else {
        alert("Server error! Please click the button again.");
      }

    } catch (err) {
      console.error(err);
      alert("Network Error! Check your internet connection.");
    } finally {
      btn.disabled = false;
      loader.style.display = 'none';
    }
  }, 100);
}

function copyShareLink() {
  const input = document.getElementById('shareUrlInput');
  input.select();
  navigator.clipboard.writeText(input.value);
  alert("Link Copied Successfully!");
}
</script>

</body>
  </html>
