<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Master Pro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>📚 Quiz Master Pro</h1>

<p style="text-align:center;">
Ek subject chunein aur foran MCQs practice karna shuru karein.
</p>

<label style="font-weight:bold; display:block; margin-top:15px; margin-bottom:5px;">Subject Chunein:</label>
<select id="subjectSelect" style="width:100%; padding:12px; border-radius:8px; border:1px solid #ccc; font-size:16px;">
  <option value="chemistry">🧪 Chemistry</option>
  <option value="biology">🧬 Biology</option>
  <option value="physics">⚡ Physics</option>
</select>

<button onclick="startLocalQuiz()">
🚀 Start Quiz
</button>

<button onclick="location.href='upload.html'" style="background:#16a34a;">
📤 Apna Test Banayein / Share Karein
</button>

</div>

<script src="quiz-data.js"></script>
<script>
function startLocalQuiz() {
  const subject = document.getElementById('subjectSelect').value;
  localStorage.setItem('selectedSubject', subject);
  window.location.href = 'quiz.html';
}
</script>

</body>

</html>
